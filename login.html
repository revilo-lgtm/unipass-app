<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - UniPass</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* HỆ THỐNG BIẾN MÀU SẮC CHUNG */
        :root {
            --primary: #4F46E5;
            --primary-light: #818CF8;
            --secondary: #EC4899;
            --gradient: linear-gradient(135deg, #4F46E5 0%, #EC4899 100%);
            
            --bg-color: #F8FAFC;
            --surface: #FFFFFF;
            --text-main: #0F172A;
            --text-muted: #64748B;
            --border-color: #E2E8F0;
            --shadow-lg: 0 20px 40px -10px rgba(0, 0, 0, 0.1);
        }
        #session-notice { display: none; max-width: 420px; margin: 0 auto 18px; padding: 12px 14px; color: #7f1d1d; background: #fee2e2; border: 1px solid #fca5a5; border-radius: 8px; font-size: 13px; line-height: 1.45; }
        #session-notice.show { display: block; }

        [data-theme="dark"] {
            --bg-color: #0F172A;       
            --surface: #1E293B;        
            --text-main: #F8FAFC;      
            --text-muted: #94A3B8;     
            --border-color: #334155;   
            --shadow-lg: 0 20px 40px -10px rgba(0, 0, 0, 0.5);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.3s ease, color 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        /* Hình nền trang trí */
        .bg-shape {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            opacity: 0.5;
        }
        .bg-shape-1 { top: -10%; left: -10%; width: 400px; height: 400px; background: rgba(79, 70, 229, 0.3); }
        .bg-shape-2 { bottom: -10%; right: -10%; width: 500px; height: 500px; background: rgba(236, 72, 153, 0.2); }

        /* Nút quay lại & Nút Dark Mode */
        .top-controls {
            position: absolute;
            top: 30px;
            left: 0;
            width: 100%;
            padding: 0 40px;
            display: flex;
            justify-content: space-between;
            z-index: 10;
        }

        .back-link {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }
        .back-link:hover { color: var(--primary); }

        .theme-toggle {
            background: transparent; border: 1px solid var(--border-color); color: var(--text-main);
            width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex;
            align-items: center; justify-content: center; transition: all 0.3s;
        }
        .theme-toggle:hover { background: var(--surface); color: var(--primary); border-color: var(--primary); }

        /* Container Đăng nhập */
        .login-container {
            background: var(--surface);
            width: 100%;
            max-width: 480px;
            padding: 48px;
            border-radius: 24px;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-color);
            z-index: 1;
            position: relative;
        }

        .logo-center {
            text-align: center;
            font-size: 32px;
            font-weight: 800;
            color: var(--primary);
            text-decoration: none;
            display: block;
            margin-bottom: 8px;
        }
        .logo-center span { color: var(--secondary); }

        .login-header { text-align: center; margin-bottom: 32px; }
        .login-header h1 { font-size: 24px; color: var(--text-main); margin-bottom: 8px; }
        .login-header p { color: var(--text-muted); font-size: 15px; }

        /* Nút Social Login */
        .social-login { display: flex; gap: 16px; margin-bottom: 24px; }
        .btn-social {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background: transparent;
            color: var(--text-main);
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-social:hover { background: var(--bg-color); border-color: var(--primary-light); }
        .btn-social img { width: 20px; height: 20px; }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 24px;
        }
        .divider::before, .divider::after {
            content: ''; flex: 1; border-bottom: 1px solid var(--border-color);
        }
        .divider::before { margin-right: 16px; }
        .divider::after { margin-left: 16px; }

        /* Form Controls */
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; color: var(--text-main); }
        .form-group input {
            width: 100%; padding: 14px 16px;
            border: 1px solid var(--border-color); border-radius: 12px;
            background: var(--bg-color); color: var(--text-main); font-size: 15px; outline: none;
            transition: border-color 0.2s;
        }
        .form-group input:focus { border-color: var(--primary); }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            font-size: 14px;
        }
        .remember-me { display: flex; align-items: center; gap: 8px; color: var(--text-muted); cursor: pointer; }
        .forgot-password { color: var(--primary); text-decoration: none; font-weight: 600; }
        .forgot-password:hover { text-decoration: underline; }

        /* Nút Submit */
        .btn-submit {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 16px;
            background: var(--gradient);
            color: white;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px -10px rgba(79, 70, 229, 0.5);
        }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 15px 25px -10px rgba(79, 70, 229, 0.6); }

        .register-link {
            text-align: center;
            margin-top: 24px;
            font-size: 15px;
            color: var(--text-muted);
        }
        .register-link a { color: var(--primary); font-weight: 600; text-decoration: none; }
        .register-link a:hover { text-decoration: underline; }

        .register-modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 20;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(15, 23, 42, 0.55);
        }
        .register-modal.show { display: flex; }
        .register-modal-content {
            position: relative;
            width: min(100%, 480px);
            max-height: calc(100vh - 40px);
            overflow-y: auto;
            padding: 36px;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            background: var(--surface);
            box-shadow: var(--shadow-lg);
        }
        .register-modal-content h2 { margin-bottom: 8px; }
        .register-modal-content p { color: var(--text-muted); margin-bottom: 24px; font-size: 14px; }
        .register-close {
            position: absolute;
            top: 14px;
            right: 18px;
            border: 0;
            background: transparent;
            color: var(--text-muted);
            font-size: 28px;
            line-height: 1;
            cursor: pointer;
        }
        .register-modal select {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background: var(--bg-color);
            color: var(--text-main);
            font-size: 15px;
            outline: none;
        }

        @media (max-width: 600px) {
            .login-container { margin: 20px; padding: 32px 24px; }
            .top-controls { padding: 0 20px; top: 20px; }
            .register-modal-content { padding: 32px 24px 24px; }
        }
    </style>
</head>
<body>

    <div class="bg-shape bg-shape-1"></div>
    <div class="bg-shape bg-shape-2"></div>

    <div class="top-controls">
        <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Về trang chủ</a>
        <button id="theme-toggle" class="theme-toggle" aria-label="Toggle Dark Mode">
            <i class="fa-solid fa-moon"></i>
        </button>
    </div>

    <div class="login-container">
        <a href="index.html" class="logo-center">Uni<span>Pass</span></a>
        <div id="session-notice" role="alert"></div>
        
        <div class="login-header">
            <h1>Chào mừng trở lại! 👋</h1>
            <p>Tiếp tục lộ trình học trúng đích của bạn.</p>
        </div>

        <div class="social-login">
            <button class="btn-social">
                <i class="fa-brands fa-google" style="color: #DB4437; font-size: 18px;"></i> Google
            </button>
            <button class="btn-social">
                <i class="fa-brands fa-microsoft" style="color: #00A4EF; font-size: 18px;"></i> Microsoft
            </button>
        </div>

        <div class="divider">Hoặc đăng nhập bằng Email</div>

        <form id="login-form">
            <div class="form-group">
                <label for="email">Email sinh viên</label>
                <input type="text" id="email" placeholder="Nhập email của trường (VD: sv.tendangnhap@st.ueh.edu.vn)" required>
            </div>

            <div class="form-group">
                <label for="password">Mật khẩu</label>
                <input type="password" id="password" placeholder="Nhập mật khẩu" required>
            </div>

            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox"> Ghi nhớ tài khoản
                </label>
                <a href="#" class="forgot-password">Quên mật khẩu?</a>
            </div>

            <button type="submit" class="btn-submit">Đăng nhập</button>
        </form>

        <div class="register-link">
            Chưa có tài khoản? <a href="#" id="open-register-modal">Đăng ký Membership</a>
        </div>
    </div>

    <div class="register-modal" id="register-modal" role="dialog" aria-modal="true" aria-labelledby="register-modal-title">
        <div class="register-modal-content">
            <button type="button" class="register-close" id="close-register-modal" aria-label="Đóng">&times;</button>
            <h2 id="register-modal-title">Đăng ký Membership</h2>
            <p>Tạo tài khoản để bắt đầu lộ trình học tập của bạn.</p>
            <form id="register-form">
                <div class="form-group">
                    <label for="register-fullname">Họ và tên</label>
                    <input type="text" id="register-fullname" placeholder="Nhập họ và tên" required>
                </div>
                <div class="form-group">
                    <label for="register-email">Email sinh viên</label>
                    <input type="email" id="register-email" placeholder="VD: sv.tenban@st.ueh.edu.vn" required>
                </div>
                <div class="form-group">
                    <label for="register-university">Trường Đại học</label>
                    <select id="register-university" required>
                        <option value="" disabled selected>-- Chọn trường của bạn --</option>
                        <option value="ueh">Đại học Kinh tế TP.HCM (UEH)</option>
                        <option value="bk">Đại học Bách Khoa (HCMUT)</option>
                        <option value="ftu">Đại học Ngoại thương (FTU)</option>
                        <option value="neu">Đại học Kinh tế Quốc dân (NEU)</option>
                        <option value="hcmus">Đại học Khoa học Tự nhiên (HCMUS)</option>
                        <option value="tdtu">Đại học Tôn Đức Thắng (TDTU)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="register-password">Mật khẩu</label>
                    <input type="password" id="register-password" placeholder="Tạo mật khẩu tối thiểu 6 ký tự" minlength="6" required>
                </div>
                <button type="submit" class="btn-submit">Đăng ký tài khoản</button>
            </form>
        </div>
    </div>

    <script src="auth.js"></script>
    <script>
        const sessionNotice = document.getElementById('session-notice');
        const sessionNoticeMessage = localStorage.getItem('unipass_session_notice');
        if(sessionNoticeMessage){
            sessionNotice.textContent = sessionNoticeMessage;
            sessionNotice.classList.add('show');
            localStorage.removeItem('unipass_session_notice');
        }

        /* --- DARK MODE LOGIC ĐỒNG BỘ --- */
        const themeToggleBtn = document.getElementById('theme-toggle');
        const themeIcon = themeToggleBtn.querySelector('i');
        const htmlElement = document.documentElement;

        // Đọc trạng thái từ localStorage
        const savedTheme = localStorage.getItem('unipass_theme');
        if (savedTheme) {
            htmlElement.setAttribute('data-theme', savedTheme);
            updateIcon(savedTheme);
        } else {
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (prefersDark) {
                htmlElement.setAttribute('data-theme', 'dark');
                updateIcon('dark');
            }
        }

        themeToggleBtn.addEventListener('click', () => {
            const currentTheme = htmlElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            htmlElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('unipass_theme', newTheme);
            updateIcon(newTheme);
        });

        function updateIcon(theme) {
            if (theme === 'dark') {
                themeIcon.classList.remove('fa-moon');
                themeIcon.classList.add('fa-sun');
            } else {
                themeIcon.classList.remove('fa-sun');
                themeIcon.classList.add('fa-moon');
            }
        }

        /* --- XỬ LÝ ĐĂNG NHẬP --- */
        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            // Allow admin login shortcut without email-format validation
            if(email !== 'admin'){
                // basic email format check for normal users
                const simpleEmailRe = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if(!simpleEmailRe.test(email)){
                    alert('Vui lòng nhập email hợp lệ (ví dụ: sv.tendangnhap@st.ueh.edu.vn)');
                    return;
                }
            }

            try {
                const res = await window.Auth.login(email, password);
                if(res.ok){
                    window.location.href = 'dashboard.html';
                } else {
                    alert(res.msg || 'Email hoặc mật khẩu không đúng. Tài khoản mẫu: mssv@st.ueh.edu.vn / 123456.');
                }
            } catch(error) {
                alert('Không thể kết nối đến máy chủ. Vui lòng thử lại sau.');
            }
        });

        const registerModal = document.getElementById('register-modal');
        const openRegisterModal = document.getElementById('open-register-modal');
        const closeRegisterModal = document.getElementById('close-register-modal');
        const registerForm = document.getElementById('register-form');

        openRegisterModal.addEventListener('click', function(e) {
            e.preventDefault();
            registerModal.classList.add('show');
            document.getElementById('register-fullname').focus();
        });
        closeRegisterModal.addEventListener('click', () => registerModal.classList.remove('show'));
        registerModal.addEventListener('click', e => {
            if(e.target === registerModal) registerModal.classList.remove('show');
        });
        registerForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            const submitButton = this.querySelector('button[type="submit"]');
            submitButton.disabled = true;
            const res = await window.Auth.register({
                fullname: document.getElementById('register-fullname').value.trim(),
                email: document.getElementById('register-email').value.trim(),
                university: document.getElementById('register-university').value,
                password: document.getElementById('register-password').value,
            });
            submitButton.disabled = false;
            if(!res.ok){
                alert(res.msg || 'Đăng ký thất bại.');
                return;
            }
            alert('Đăng ký thành công. Bạn sẽ được chuyển đến trang học tập.');
            window.location.href = 'student-courses.html';
        });
    </script>
</body>
</html>
